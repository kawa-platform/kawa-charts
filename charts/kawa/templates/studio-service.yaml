{{- if .Values.studio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kawa.studio.fullname" . }}
  labels:
    {{- include "kawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: studio
  {{- with .Values.studio.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.studio.service.type }}
  selector:
    {{- include "kawa.studio.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.studio.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
