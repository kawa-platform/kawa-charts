{{- if and .Values.gateway.enabled .Values.gateway.adminIngress.enabled }}
{{- $ing := .Values.gateway.adminIngress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kawa.gateway.fullname" . }}-admin
  labels:
    {{- include "kawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kawa.gateway.fullname" . }}
                port:
                  name: admin
{{- end }}
