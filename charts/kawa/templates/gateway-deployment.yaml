{{- if .Values.gateway.enabled }}
{{- $gw := .Values.gateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kawa.gateway.fullname" . }}
  labels:
    {{- include "kawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ $gw.replicaCount }}
  selector:
    matchLabels:
      {{- include "kawa.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kawa.gateway.selectorLabels" . | nindent 8 }}
        {{- with $gw.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not $gw.existingConfigMap }}
        checksum/config: {{ include "kawa.gateway.config" . | sha256sum }}
        {{- end }}
        {{- with $gw.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ $gw.image.repository }}:{{ $gw.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $gw.image.pullPolicy }}
          {{- with $gw.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: kafka
              containerPort: {{ include "kawa.gateway.kafkaPort" . }}
              protocol: TCP
            - name: admin
              containerPort: {{ include "kawa.gateway.adminPort" . }}
              protocol: TCP
          env:
            - name: KAWA_LOG_LEVEL
              value: {{ $gw.logLevel | quote }}
            - name: KAWA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kawa.gateway.secretName" . }}
                  key: admin-password
            - name: KAWA_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kawa.gateway.secretName" . }}
                  key: signing-key
            {{- if $gw.adminReset }}
            - name: KAWA_ADMIN_RESET
              value: "true"
            {{- end }}
            {{- with $gw.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with $gw.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kawa
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with $gw.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $gw.existingConfigMap | default (include "kawa.gateway.fullname" .) }}
        - name: tmp
          emptyDir: {}
        {{- with $gw.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $gw.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
