# Values for the kawa umbrella chart. Everything under kawa-gateway / kawa-operator is passed to that
# subchart; see charts/kawa-gateway/values.yaml here and charts/kawa-operator/values.yaml in kawa-operator.
#
# Each component is pinned on a line marked `# kawa-release: <component>`: the gateway and studio image tags
# here, the kawa-operator chart version in Chart.yaml. `make release` rewrites those lines with the versions it
# just released, so keep each marker on the same line as its tag or version.

kawa-gateway:
  enabled: true
  gateway:
    image:
      tag: "0.1.0-rc.3"  # kawa-release: gateway
  studio:
    image:
      tag: "0.1.0-rc.3"  # kawa-release: studio

kawa-operator:
  enabled: true
