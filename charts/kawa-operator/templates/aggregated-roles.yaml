# Whoever may view or edit a namespace may view or manage its VirtualTopics: these roles join Kubernetes'
# built-in view, edit and admin roles through aggregation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kawa-operator.fullname" . }}-virtualtopic-view
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [kawa.io]
    resources: [virtualtopics, virtualtopics/status]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kawa-operator.fullname" . }}-virtualtopic-edit
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [kawa.io]
    resources: [virtualtopics]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [kawa.io]
    resources: [virtualtopics/status]
    verbs: [get]
