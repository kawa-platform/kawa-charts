# Default values for the kawa chart: kawa-gateway (Kafka gateway + admin API) and kawa-studio (admin UI).

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: [ ]

gateway:
  enabled: true

  # The gateway's config.yaml, exactly as the gateway docs describe it. It is mounted at
  # /etc/kawa/config.yaml. Use ${VAR} or ${VAR:-default} for values from the environment: the chart
  # provides KAWA_ADMIN_PASSWORD and KAWA_SIGNING_KEY (see gateway.secrets), and gateway.extraEnv
  # adds more. The chart sets one key itself: advertised.host, to the Service's DNS name when unset.
  config: { }

  # Use an existing ConfigMap with a config.yaml key instead of gateway.config. The chart cannot
  # read that file, so the ports come from gateway.service.kafkaPort and adminPort below.
  existingConfigMap: ""

  # Secrets injected as KAWA_ADMIN_PASSWORD and KAWA_SIGNING_KEY. Empty values are generated on
  # first install and kept across upgrades. An existing Secret needs the keys admin-password and
  # signing-key.
  secrets:
    existingSecret: ""
    adminPassword: ""
    signingKey: ""

  replicaCount: 1

  image:
    repository: kawa-gateway
    tag: latest
    pullPolicy: IfNotPresent

  # Resets the bootstrap admin user's password to the one in config on start (KAWA_ADMIN_RESET=true).
  adminReset: false

  logLevel: INFO

  # Extra environment variables, e.g. a service client secret from an existing Secret, referenced
  # from gateway.config as ${VAR}.
  extraEnv: [ ]
  extraVolumes: [ ]
  # e.g. TLS stores, or plugins under /opt/kawa/plugins
  extraVolumeMounts: [ ]

  service:
    type: ClusterIP
    # Used only with existingConfigMap. Otherwise the ports are read from gateway.config
    # (listeners[0].port and admin.port, with the gateway's defaults 9092 and 8080).
    kafkaPort: 9092
    adminPort: 8080
    annotations: { }
    # Only for type LoadBalancer / NodePort
    loadBalancerIP: ""
    externalTrafficPolicy: ""

  # Exposes the gateway's admin API on its own host. Needed when Studio was built with the default
  # (absolute) VITE_API_BASE / VITE_ADMIN_API_BASE; not needed when Studio was built with `/api`
  # (it then reaches the gateway through its own nginx).
  adminIngress:
    enabled: false
    className: ""
    annotations: { }
    host: kawa-api.local
    tls: [ ]
    #  - secretName: kawa-api-tls
    #    hosts: [kawa-api.local]

  podAnnotations: { }
  podLabels: { }
  podSecurityContext: { }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ ALL ]
  resources: { }
  nodeSelector: { }
  tolerations: [ ]
  affinity: { }

studio:
  enabled: true
  replicaCount: 1

  image:
    repository: kawa-studio
    tag: latest
    pullPolicy: IfNotPresent

  # Where Studio's nginx proxies /api/ to (with the /api prefix stripped), passed to the image as
  # KAWA_API_UPSTREAM. Defaults to this release's gateway admin Service. Needs a Studio image with
  # the nginx config template (0.1.0-rc.2 or later).
  apiUpstream: ""

  service:
    type: ClusterIP
    port: 80
    annotations: { }

  podAnnotations: { }
  podLabels: { }
  podSecurityContext: { }
  securityContext: { }
  resources: { }
  nodeSelector: { }
  tolerations: [ ]
  affinity: { }

# Exposes Kawa Studio (/admin, plus /api proxied to the gateway). This host is also the address
# browsers open Studio on, so it must match the login URL and CORS origin in gateway.config.
ingress:
  enabled: false
  className: ""
  annotations: { }
  host: kawa.local
  tls: [ ]
  #  - secretName: kawa-tls
  #    hosts: [kawa.local]
