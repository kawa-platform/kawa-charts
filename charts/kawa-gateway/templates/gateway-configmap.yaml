{{- if and .Values.gateway.enabled (not .Values.gateway.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kawa.gateway.fullname" . }}
  labels:
    {{- include "kawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  config.yaml: |
    {{- include "kawa.gateway.config" . | nindent 4 }}
{{- end }}
