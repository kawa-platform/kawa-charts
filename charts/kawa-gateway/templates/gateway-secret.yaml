{{- if and .Values.gateway.enabled (not .Values.gateway.secrets.existingSecret) }}
{{- $name := include "kawa.gateway.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $secrets := .Values.gateway.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kawa.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $secrets.adminPassword }}
  admin-password: {{ $secrets.adminPassword | b64enc | quote }}
  {{- else }}
  admin-password: {{ get $existing "admin-password" | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  {{- if $secrets.signingKey }}
  signing-key: {{ $secrets.signingKey | b64enc | quote }}
  {{- else }}
  signing-key: {{ get $existing "signing-key" | default (genPrivateKey "ecdsa" | b64enc) | quote }}
  {{- end }}
{{- end }}
