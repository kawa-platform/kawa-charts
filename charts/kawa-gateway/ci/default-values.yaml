# Values CI renders the chart with (see .github/workflows/charts.yml).
gateway:
  config:
    listeners:
      - host: 0.0.0.0
        port: 9092
    clusters:
      default:
        bootstrapServers:
          - kafka.kafka.svc.cluster.local:9092
    admin:
      enabled: true
      port: 8080
      auth:
        type: oauth
        bootstrapUser:
          username: admin@kawa
          password: ${KAWA_ADMIN_PASSWORD}
        settings:
          loginUrl: https://kawa.example.com/admin/login
          redirectUris:
            - https://kawa.example.com/admin/auth/callback
          signingKey: ${KAWA_SIGNING_KEY}
      cors:
        allowedOrigins:
          - https://kawa.example.com
