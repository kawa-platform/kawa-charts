# Publishes the kawa chart when a tag `kawa-<version>` (e.g. kawa-0.2.0 or kawa-0.2.0-rc.1) is pushed by
# scripts/release.sh. The version must match charts/kawa/Chart.yaml; the chart is linted first
# (helm-lint.yml), then pushed to oci://ghcr.io/<owner>/charts/kawa.

name: Release

on:
  push:
    tags: [ 'kawa-[0-9]*.*.*' ]

permissions: {}

env:
  REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART: kawa

jobs:
  lint:
    # A called workflow can use no more permissions than its caller grants.
    permissions:
      contents: read
    uses: ./.github/workflows/helm-lint.yml

  publish:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v4

      - name: Check the tag against Chart.yaml
        run: |
          version="${GITHUB_REF_NAME#"$CHART"-}"
          chart_version="$(helm show chart "charts/$CHART" | awk '/^version:/ {print $2}')"
          if [[ "$chart_version" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match charts/$CHART/Chart.yaml version $chart_version"
            exit 1
          fi

      - name: Package and push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm package "charts/$CHART" --destination dist
          helm push dist/*.tgz "$REGISTRY"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v4

      - name: Package the chart and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#"$CHART"-}"
          helm package "charts/$CHART" --destination dist
          args=(--title "$TAG" --generate-notes "$TAG" "dist/$CHART-$version.tgz")
          [[ "$version" == *-* ]] && args+=(--prerelease)
          gh release create "${args[@]}"
