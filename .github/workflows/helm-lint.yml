# Lints and validates every chart on pull requests and pushes to main. Also called by release.yml, so a
# tagged release is linted the same way before it is published.

name: Helm lint

on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

env:
  KUBECONFORM_VERSION: v0.7.0

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The kawa chart's kawa-operator dependency is a private ghcr package.
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Lint and validate
        run: |
          # Each chart is rendered with every charts/<chart>/ci/*-values.yaml (the chart-testing convention).
          for chart in charts/*/; do
            # Pulls in file:// subcharts (the kawa umbrella); a no-op for charts without dependencies.
            helm dependency update "$chart" >/dev/null
            for values in "$chart"ci/*-values.yaml; do
              echo "::group::$chart with $values"
              helm lint "$chart" --values "$values"
              # kubeconform has no schema for CRDs and custom resources: those are skipped, not failed.
              helm template ci "$chart" --namespace ci --values "$values" \
                | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0
              echo "::endgroup::"
            done
          done
